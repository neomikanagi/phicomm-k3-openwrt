name: Build K3 firmware

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'config/**'
      - 'files/**'
      - 'scripts/**'
      - 'tests/**'
      - 'sources.lock.json'

permissions:
  contents: read

concurrency:
  group: k3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck lua5.1 lua-yaml python3-yaml
      - name: Offline checks
        run: |
          bash scripts/test.sh
          lua5.1 tests/adguard_config_test.lua

  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BUILD: /mnt/k3-openwrt
      GOMAXPROCS: '2'
      GOMEMLIMIT: 2GiB
      TZ: UTC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare runner (GitHub-hosted disposable VM only)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext \
            git libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools \
            rsync swig unzip zlib1g-dev file wget curl jq zstd libelf-dev \
            autoconf automake libtool pkgconf time
          sudo chown "$USER:$USER" /mnt
          df -h /mnt
      - name: Fetch locked official source and prepare K3
        run: bash scripts/prepare.sh "$BUILD" 2>&1 | tee prepare.log
      - name: Download package sources
        run: make -C "$BUILD" download -j8
      - name: Compile OpenWrt with selected packages
        run: |
          cd "$BUILD"
          LOG="$GITHUB_WORKSPACE/build.log"
          # A serial retry resumes the tree and separates parallel-build races from real errors.
          if ! { make -j"$(nproc)" V=s > "$LOG" 2>&1 || make -j1 V=s >> "$LOG" 2>&1; }; then
            tail -n 200 "$LOG"
            exit 1
          fi
      - name: Verify firmware and collect provenance
        run: bash scripts/collect.sh "$BUILD" "$GITHUB_WORKSPACE/dist"
      - name: Upload firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: k3-openwrt-25.12.6
          path: dist/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Save available configuration diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          if [ -f "$BUILD/.config" ]; then cp "$BUILD/.config" diagnostics/build.config; fi
          if [ -f "$BUILD/tmp/.config-package.in" ]; then cp "$BUILD/tmp/.config-package.in" diagnostics/package-kconfig.txt; fi
          if [ -d "$BUILD/logs" ]; then cp -a "$BUILD/logs" diagnostics/; fi
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-log
          path: |
            build.log
            prepare.log
            diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - name: State validation boundary
        if: success()
        run: |
          echo '### K3 firmware' >> "$GITHUB_STEP_SUMMARY"
          echo 'Compilation, manifest and rootfs checks passed. Hardware NOT tested. Do not flash a K3C or bypass sysupgrade compatibility checks.' >> "$GITHUB_STEP_SUMMARY"
